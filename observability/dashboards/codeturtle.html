<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeTurtle</title><style>
:root{color-scheme:light dark;--bg:light-dark(#fafbfc,#11141a);--panel:light-dark(#fff,#1a1e27);--fg:light-dark(#182033,#edf0f8);--muted:light-dark(#647084,#a0acc0);--line:light-dark(#dfe4ed,#303747);--accent:light-dark(#6750c5,#b1a0ff)}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui}header,.controls,nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}p{color:var(--muted)}button,select,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}nav{margin:24px 0;border-bottom:1px solid var(--line);padding-bottom:12px}nav button[aria-selected=true]{background:var(--accent);color:var(--bg)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:18px;overflow:auto}.metrics .card{margin:0}.value{font-size:28px;font-weight:650;margin:6px 0}.label,small,#status{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}td,th{padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}td button{font-size:12px;padding:4px 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:110px 1fr 95px;align-items:center;gap:12px}.track{height:10px;background:var(--line);border-radius:3px}.fill{height:100%;background:var(--accent);border-radius:3px}.note{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel)}.empty{padding:30px;color:var(--muted)}summary{cursor:pointer}#detail[hidden]{display:none}a{color:var(--accent)}.failed{color:light-dark(#b42318,#ff8f88);font-weight:700}.unknown{color:var(--muted)}.failed a{color:inherit}@media(max-width:760px){body{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
td{vertical-align:top;white-space:pre-line}td button{margin-left:10px}.label{display:block;margin-top:5px}</style></head><body><header><div><h1>CodeTurtle</h1><span class="label">Pull requests and review ownership</span></div><div class="controls"><input id="filter" aria-label="Filter PRs" placeholder="Repository or PR number"><select id="window" aria-label="Time window"><option value="24" selected>24 hours</option><option value="168">7 days</option><option value="0">All time</option></select><label><input type="checkbox" id="auto" checked> Auto-refresh</label><button id="refresh">Refresh</button></div></header><nav role="tablist" aria-label="Dashboard views"></nav><div id="status" role="status"></div><main id="content"></main><section id="detail" class="card" hidden></section><details class="card"><summary>SQL queries</summary><pre id="sql"></pre></details><script>const $=s=>document.querySelector(s),el=(t,text,cls)=>{const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
const views=['Recent PRs','Reviewers','Subsystems','Backend'];let active=0,events=[],service=[],busy=false;
const parse=x=>{try{return typeof x==='string'?JSON.parse(x):x||{}}catch{return {}}};
const link=(text,url)=>{const a=el('a',text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a};
const time=x=>x?new Date(x).toLocaleString():'—';
const gh=e=>'https://github.com/'+e.repository+'/pull/'+e.pr;
const review=e=>'https://boundary-codeturtle-staging.fly.dev/?run='+encodeURIComponent(e.run_id);
const subsystem=p=>p.includes('/baml_std/')?'Standard library':p.includes('/baml_env/')||p.endsWith('/ENV_VARS.md')?'Environment variables':p.includes('/')?p.slice(0,p.lastIndexOf('/')):'Repository root';
function card(title){const x=el('section',undefined,'card');x.append(el('h2',title));return x}
function table(title,heads,values){const c=card(title);if(!values.length){c.append(el('p','No matching data in this window.'));return c}const t=el('table'),h=el('tr');heads.forEach(v=>h.append(el('th',v)));const thead=el('thead');thead.append(h);t.append(thead);const b=el('tbody');for(const row of values){const r=el('tr');row.forEach(v=>{const d=el('td');if(v instanceof Node)d.append(v);else d.textContent=v??'—';r.append(d)});b.append(r)}t.append(b);c.append(t);return c}
function inspect(s){const d=$('#detail');d.hidden=false;d.replaceChildren(el('h2','Trace event'));const a=el('button','Open span in Studio');a.onclick=()=>boundary.openSpan(s.span_id);const close=el('button','Close');close.onclick=()=>d.hidden=true;d.append(a,close,el('pre',JSON.stringify(s.event,null,2)))}
function prDetails(e){const d=$('#detail');d.hidden=false;d.replaceChildren(el('h2',e.repository+' #'+e.pr));d.append(el('p',e.title||''),el('p','Author: @'+(e.author||'not recorded')+' · Commit: '+(e.head||'—')),link('View code diff on GitHub',gh(e)+'/files'));const files=new Map();for(const s of events){const a=s.event;if(a.run_id!==e.run_id)continue;if(a.kind==='file')files.set(a.path,{...a,owners:files.get(a.path)?.owners||[]});if(a.kind==='assignment')files.set(a.path,{...files.get(a.path),...a})}d.append(workflowCell(e));d.append(el('p','Workflow latency: '+duration(latency(e))+' · GitHub job start to completion, including checkout and CLI installation.'));d.append(table('Changed code',['File','Subsystem','Reviewers','Diff'],[...files.values()].map(a=>[a.path,subsystem(a.path),(a.owners||[]).join(', ')||'No assignment recorded',a.additions!==undefined?'+'+a.additions+' / −'+a.deletions:'Open GitHub diff'])));d.append(el('p','Live events record policy-matched files. Imported GitHub snapshots also include other changed files. Source code is available through the diff link.','label'));const close=el('button','Close');close.onclick=()=>d.hidden=true;d.append(close);d.scrollIntoView({behavior:'smooth',block:'nearest'})}
function workflow(e){return events.find(s=>s.event.kind==='workflow'&&s.event.repository===e.repository&&((s.event.report_run_id&&s.event.report_run_id===e.run_id)||(e.github_run_id&&String(s.event.github_run_id)===String(e.github_run_id)&&Number(s.event.attempt)===Number(e.attempt))))?.event}
const failed=e=>e.outcome==='Workflow failed'||['failure','timed_out','action_required','startup_failure'].includes(workflow(e)?.workflow_status)||e.evaluation_status==='failed';
function workflowCell(e){const w=workflow(e),status=w?.workflow_status||'Not recorded';const cell=el('div',undefined,failed(e)?'failed':'unknown');cell.append(w?.job_url?link(status,w.job_url):el('span',status));return cell}
function selected(){const hours=Number($('#window').value),cut=hours?Date.now()-hours*3600000:0,query=$('#filter').value.toLowerCase();const byRun=new Map();for(const s of events){const e=s.event;if(e.kind==='report'&&Date.parse(e.occurred_at||s.start_time)>=cut&&!byRun.has(e.run_id))byRun.set(e.run_id,{...e,span:s})}
 for(const s of events){const e=s.event;if(e.kind==='workflow'&&Date.parse(e.occurred_at||s.start_time)>=cut&&![...byRun.values()].some(r=>workflow(r)===e)){const key=e.repository+':'+e.github_run_id+':'+e.attempt;if(!byRun.has(key))byRun.set(key,{...e,run_id:e.report_run_id||e.run_id,pr:e.pr||'—',outcome:'No report received',span:s})}}
 return [...byRun.values()].filter(e=>(e.repository+' #'+e.pr+' '+(e.title||'')).toLowerCase().includes(query)).sort((a,b)=>Date.parse(b.occurred_at)-Date.parse(a.occurred_at))}
function assignments(runs){const ids=new Set(runs.map(r=>r.run_id)),seen=new Set();return events.filter(s=>{const e=s.event,k=e.run_id+':'+e.index;if(e.kind!=='assignment'||!ids.has(e.run_id)||seen.has(k))return false;seen.add(k);return true}).map(s=>s.event)}
function latency(e){const w=workflow(e);if(w?.started_at&&w?.completed_at)return Date.parse(w.completed_at)-Date.parse(w.started_at);return events.find(s=>s.event.kind==='timing'&&s.event.run_id===e.run_id)?.event.workflow_duration_ms}
const duration=x=>Number.isFinite(x)?(x/1000).toFixed(1)+' s':'—';
function backendView(main){
 const hours=Number($('#window').value),cut=hours?Date.now()-hours*3600000:0;
 const data=service.filter(s=>Date.parse(s.start_time)>=cut);
 const controls=el('div',undefined,'controls'),search=el('input'),stage=el('select'),errors=el('input'),label=el('label');
 search.placeholder='Search function or process';search.setAttribute('aria-label','Search backend calls');
 for(const value of ['All stages','request','database','provider']){const o=el('option',value);o.value=value;stage.append(o)}
 stage.setAttribute('aria-label','Backend stage');errors.type='checkbox';label.append(errors,document.createTextNode(' Exceptions only'));
 controls.append(search,stage,label,link('Fly console logs','https://fly.io/apps/boundary-codeturtle-staging/monitoring'));main.append(controls);
 main.append(el('p','Recorded backend calls. Return means the function completed; handled HTTP errors can still return normally. Raw stdout/stderr logs remain in Fly.','label'));
 const body=el('div');main.append(body);
 const ms=n=>Number.isFinite(Number(n))?Number(n).toFixed(1)+' ms':'—';
 const exception=s=>s.status!=='return';
 const draw=()=>{
  const q=search.value.toLowerCase(),rows=data.filter(s=>(stage.value==='All stages'||parse(s.context_metadata).stage===stage.value)&&(!errors.checked||exception(s))&&(s.span_name+' '+s.process_id).toLowerCase().includes(q));
  body.replaceChildren();const requests=rows.filter(s=>parse(s.context_metadata).stage==='request'),ds=requests.map(s=>Number(s.duration_ms)).filter(Number.isFinite).sort((a,b)=>a-b),stats=el('div',undefined,'metrics');
  for(const [name,value] of [['Calls',rows.length],['Exceptions',rows.filter(exception).length],['Request p50',ds.length?ms(ds[Math.ceil(ds.length*.5)-1]):'—'],['Request p95',ds.length?ms(ds[Math.ceil(ds.length*.95)-1]):'—']]){const c=card(name);c.append(el('div',value,'value'));stats.append(c)}body.append(stats);
  const groups=new Map();for(const s of rows){const key=parse(s.context_metadata).stage||'unknown';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s)}
  body.append(table('Latency by stage',['Stage','Calls','Exceptions','p50','p95'],[...groups].map(([key,values])=>{const d=values.map(s=>Number(s.duration_ms)).filter(Number.isFinite).sort((a,b)=>a-b);return[key,values.length,values.filter(exception).length,d.length?ms(d[Math.ceil(d.length*.5)-1]):'—',d.length?ms(d[Math.ceil(d.length*.95)-1]):'—']})));
  body.append(table('Recent backend calls',['Started','Stage','Function','Result','Duration','Process',''],rows.slice(0,200).map(s=>{const open=el('button','Open span');open.onclick=()=>boundary.openSpan(s.span_id);return[time(s.start_time),parse(s.context_metadata).stage,s.span_name,s.status,ms(s.duration_ms),s.process_id,open]})));
  body.append(el('p',rows.length+' matching spans from the latest 2,000 service spans. Showing up to 200 calls. Metrics describe this loaded sample. The PR search does not filter backend calls.','label'));
 };search.oninput=draw;stage.onchange=draw;errors.onchange=draw;draw();
}
function render(){document.querySelectorAll('[role=tab]').forEach((b,i)=>b.setAttribute('aria-selected',String(i===active)));const main=$('#content');main.replaceChildren();if(active===3){backendView(main);return}const runs=selected(),items=assignments(runs),owners=new Set(items.flatMap(a=>a.owners||[]));const ds=runs.map(latency).filter(Number.isFinite).sort((a,b)=>a-b);const percentile=p=>ds.length?duration(ds[Math.ceil(ds.length*p)-1]):'—';const metrics=el('div',undefined,'metrics');for(const [label,value] of [['PRs',new Set(runs.map(e=>e.repository+'#'+e.pr)).size],['Reports / attempts',runs.length],['Failed attempts',runs.filter(failed).length],['Job status missing',runs.filter(e=>!workflow(e)).length],['Workflow p50',percentile(.5)],['Workflow p95',percentile(.95)],['Reviewers',owners.size],['Assigned files',new Set(items.map(a=>a.run_id+':'+a.path)).size]]){const c=card(label);c.append(el('div',value,'value'));metrics.append(c)}main.append(metrics);
if(active===0){main.append(table('Recent PRs',['PR','Author','Reported','Review result','Evaluation','GitHub job','Workflow latency','Reviewers','Files','Source',''],runs.map(e=>{const a=items.filter(a=>a.run_id===e.run_id),o=[...new Set(a.flatMap(x=>x.owners||[]))],links=el('div');if(e.kind==='report'&&!e.run_id.startsWith('github-run:'))links.append(link('Open review',review(e)));const detail=el('button','PR details');detail.onclick=()=>prDetails(e);links.append(detail);const b=el('button','Trace');b.onclick=()=>inspect(e.span);links.append(b);const title=el('div');title.append(link(e.repository+' #'+e.pr,e.job_url||gh(e)),el('div',e.title||e.head?.slice(0,10)||''));return[title,e.author?'@'+e.author:'—',time(e.occurred_at),e.outcome,e.evaluation_status||'Not recorded',workflowCell(e),duration(latency(e)),o.join(', ')||'—',e.requirements??'—',e.source==='live'?'Live':'Imported from GitHub',links]})))}
if(active===1){const rows=[];for(const a of items)for(const o of a.owners||[])rows.push([o,link(a.repository+' #'+a.pr,gh(a)),subsystem(a.path),a.path,link('Assigned review',review(a)+'&reviewer='+encodeURIComponent(o))]);main.append(table('Reviewer assignments',['Reviewer','PR','Subsystem','File','Review'],rows))}
if(active===2){const groups=new Map();for(const a of items){const key=a.run_id+':'+subsystem(a.path);if(!groups.has(key))groups.set(key,{a,paths:new Set(),owners:new Set()});const g=groups.get(key);g.paths.add(a.path);(a.owners||[]).forEach(o=>g.owners.add(o))}main.append(table('Subsystem ownership',['Subsystem','PR','Eligible reviewers','Files'],[...groups.values()].map(g=>[subsystem(g.a.path),link(g.a.repository+' #'+g.a.pr,gh(g.a)),[...g.owners].join(', '),[...g.paths].join('\n')])));main.append(el('p','Subsystem labels group file paths. Ownership comes from the evaluated policy; these labels do not change the rules.'))}

main.append(el('p','Workflow latency is GitHub job start to completion, including checkout and CLI installation; it excludes queueing and human review time. GitHub job status comes from completed-job events; Not recorded is unknown, not success. Evaluation and job status are separate. Unrecorded timings show —. Assignments show eligible owners when the report was generated, not completed approvals or confirmed GitHub notifications. Imported rows retain their original timestamps.','label'))}
views.forEach((v,i)=>{const b=el('button',v);b.setAttribute('role','tab');b.onclick=()=>{active=i;render()};$('nav').append(b)});
const eventSQL="SELECT span_id, process_id, start_time, context_metadata FROM spans WHERE span_name = 'user.record_review_event' ORDER BY start_time DESC LIMIT 10000";
const serviceSQL="SELECT span_id, process_id, span_name, start_time, status, context_metadata, CAST(duration AS BIGINT)/1000000.0 AS duration_ms FROM spans WHERE span_name LIKE 'user.%' AND span_name <> 'user.record_review_event' ORDER BY start_time DESC LIMIT 2000";
async function load(){if(busy)return;busy=true;$('#refresh').disabled=true;$('#status').textContent='Loading…';$('#sql').textContent=eventSQL+';\n\n'+serviceSQL+';';try{const [a,b]=await Promise.all([boundary.query(eventSQL),boundary.query(serviceSQL)]);if(a.outcome.status!=='complete'||b.outcome.status!=='complete')throw Error('Query incomplete');events=a.rows.map(s=>({...s,event:parse(parse(s.context_metadata).event)})).filter(s=>s.event.run_id);service=b.rows.filter(s=>parse(s.context_metadata).service==='codeturtle');render();$('#status').textContent='Updated '+new Date().toLocaleTimeString()+' · '+events.length+' review events · latest 10,000 events maximum'}catch(e){$('#status').textContent='Could not refresh: '+e.message}finally{busy=false;$('#refresh').disabled=false}}
$('#refresh').onclick=load;$('#window').onchange=render;$('#filter').oninput=render;setInterval(()=>{if($('#auto').checked&&!document.hidden)load()},30000);load();
</script></body></html>
